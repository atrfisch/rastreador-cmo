name: Atualizar dados SIOP
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * 1'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      EXERCICIO: '2026'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::orcamentoBR
            any::jsonlite
      - run: Rscript R/01_download_siop.R
      # A comparação intermediária exige snapshots CMO normalizados.
      # Acrescente aqui o comando R/02_comparar_fases.R quando eles existirem.
      - run: Rscript R/03_metadata.R
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw public/data
          git diff --cached --quiet || git commit -m "dados: atualiza snapshot SIOP"
          git push
